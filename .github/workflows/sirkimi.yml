name: sirkimi

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify fork base version matches the recorded sync point
        # Catches the stale-banner class of bug (v1.2.0 shipped reporting
        # kimi-code 0.31.1 after the 0.33.0 merge). Fails fast, before install.
        shell: bash
        run: |
          sync=$(cut -d' ' -f1 .github/UPSTREAM_SYNC | tr -d '[:space:]')
          base=$(sed -n "s/.*FORK_UPSTREAM_BASE_VERSION = '\([^']*\)'.*/\1/p" apps/kimi-code/src/constant/app.ts)
          upstream=$(curl -fsSL "https://raw.githubusercontent.com/MoonshotAI/kimi-code/${sync}/apps/kimi-code/package.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          echo "sync point: ${sync} | fork base: ${base} | upstream at sync: ${upstream}"
          if [ -z "$base" ] || [ "$base" != "$upstream" ]; then
            echo "::error::FORK_UPSTREAM_BASE_VERSION ('${base}') != upstream version at sync point ('${upstream}'). Update apps/kimi-code/src/constant/app.ts as part of the merge."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Typecheck
        run: pnpm --filter @moonshot-ai/kimi-code run typecheck

      - name: Test
        run: pnpm --filter @moonshot-ai/kimi-code exec vitest run

  native:
    name: Native binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    uses: ./.github/workflows/_native-build.yml
    with:
      upload-artifact-prefix: sirkimi-native
      retention-days: 3

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download native artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: sirkimi-native-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: sirkimi ${{ github.ref_name }}
          files: |
            dist/sirkimi-*.zip
            dist/sirkimi-*.zip.sha256
          generate_release_notes: true
